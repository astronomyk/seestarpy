[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seestarpy"
# Versioning policy: the MINOR number tracks the oldest Seestar MAJOR
# firmware version still supported.  0.7.x supports firmware 7.x (tested
# on 7.18 and 7.75) and newer.  When support for firmware 7 is dropped,
# this becomes 0.8.
version = "0.7.0"
authors = [ { name = "Kieran Leschinski", email = "kdleschinski@gmail.com" },]
description = "Python interface for the SeeStar telescope control system"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "pysmb>=1.2.9",        # SMB file operations (data module)
    "tzlocal",             # local timezone (pi_set_time)
    "requests",            # CrowdSky web API
    "cryptography>=41.0",  # RSA signing for firmware 7.18+ authentication
]

[project.optional-dependencies]
# The core package stays light: JSON-RPC control needs no array stack.
# Anything that decodes pixels does, so those live behind extras.
stream = [
    "numpy",            # decode_payload, auto_stretch
    "pillow",           # save_image, JPEG frames (firmware 8.46+)
]
# The dashboard is the stream module plus an HTTP server built on stdlib.
dashboard = [
    "seestarpy[stream]",
]
dev = [
    "pytest>=7.0",
    "seestarpy[stream]",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx_autodoc_typehints",
]

[project.urls]
"Homepage" = "https://github.com/astronomyk/seestarpy"
"Documentation" = "https://seestarpy.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/astronomyk/seestarpy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/seestarpy"]

# Without an explicit file list, hatchling packs everything in the project
# directory into the sdist — including the (untracked, multi-GB) FITS
# observation folders that accumulate in the working tree.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    "LICENSE",
    ".readthedocs.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Seestar (opt in with --live)",
    "movement: moves the telescope - slew, park, open arm, focus (skip with --no-movement)",
    "destructive: modifies telescope or data state",
    "sequence: multi-step observational sequence",
    "slow: takes more than 30 seconds",
]
addopts = "-v --tb=short"

