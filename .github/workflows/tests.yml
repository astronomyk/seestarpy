name: tests

# Offline tests only.  The live-hardware suite needs a Seestar on the same
# LAN and is opt-in behind `pytest --live`, so CI never reaches for one.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # [dev] pulls in pytest and, via [stream], numpy + pillow.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import from an installed package
        # Guards the class of bug where a module only resolves because the
        # repo root happens to be on sys.path (`from src.seestarpy...`).
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import seestarpy; print(seestarpy.__name__)"
          python -c "from seestarpy.events import event_watcher"
          python -c "from seestarpy import dashboard, stream, raw, ui, status"

      - name: Tests
        run: pytest --no-header -p no:cacheprovider

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,dev]"
      - name: Build docs
        run: sphinx-build -b html docs docs/_build/html -W --keep-going
